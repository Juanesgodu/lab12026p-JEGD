# Nombre del flujo de trabajo (así se verá en la pestaña Actions)
name: CI/CD Pipeline

on:
  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:
  # Se ejecuta en cada push a la rama main
  push:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio en la máquina virtual
      - name: Checkout
        uses: actions/checkout@v4

      # Instala Java 17 (la versión de tu pom.xml) y guarda en caché las dependencias de Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Ejecuta las pruebas unitarias
      - name: Run Tests
        run: mvn -B test