name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Tests
        run: mvn -B test

  sonar:
    name: SonarCloud analysis
    # Solo corre si el job de pruebas pasó
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: Sonar lo necesita para detectar el código nuevo
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compila, ejecuta pruebas y genera el reporte de JaCoCo
      - name: Build and test
        run: mvn -B clean verify

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.token=$SONAR_TOKEN
  build:
    name: Build
    # Solo corre si las pruebas y Sonar pasaron
    needs: sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Las pruebas ya corrieron en el job "tests", así que aquí solo se empaqueta
      - name: Build with Maven
        run: mvn -B package -DskipTests

      # Guarda el JAR para poder descargarlo y para usarlo en jobs posteriores
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: lab12026p-jar
          path: target/lab12026p-0.0.1-SNAPSHOT.jar
          retention-days: 7

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lab12026p:latest
            ${{ secrets.DOCKER_USERNAME }}/lab12026p:${{ github.sha }}

  deploy:
    name: Deploy to Render
    # Solo corre si la imagen ya fue publicada en Docker Hub
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL"